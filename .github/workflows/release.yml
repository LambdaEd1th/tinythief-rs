name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: tinythief-aarch64-apple-darwin
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: tinythief-aarch64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: tinythief-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: tinythief-x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: tinythief-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build native host
        run: cargo build --release -p tt-host --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=tt-host
          [ "${{ runner.os }}" = "Windows" ] && bin=tt-host.exe
          mkdir -p bundle
          cp "target/${{ matrix.target }}/release/$bin" bundle/
          cp README.md NOTICE.md LICENSE-MIT LICENSE-APACHE bundle/
          # Self-contained package: the encrypted game assets that the host
          # expects next to the binary (or pass their path as argv[1]).
          cp -R assets bundle/assets
          tar -czf "${{ matrix.name }}.tar.gz" -C bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    name: publish
    needs: [native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "tinythief-rs ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.tar.gz
