<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Thief — Rust/wgpu host</title>
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="copy-file" href="main.js" />
    <style>
      html, body { margin: 0; height: 100%; background: #101418; }
      body { display: grid; place-items: center; overflow: hidden;
             font: 14px/1.5 system-ui, sans-serif; color: #aab; }
      #game { position: relative; width: min(100vw, 133.33vh); aspect-ratio: 4 / 3; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none;
               cursor: crosshair; image-rendering: auto; }
      #loading { inset: 0; display: grid; place-items: center; font-size: 18px; color: #ccd; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="tt" width="1024" height="768"></canvas>
      <div id="loading">Loading Tiny Thief…</div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
