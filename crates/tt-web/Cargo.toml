[package]
name = "tt-web"
description = "Browser (WebAssembly) build of the Tiny Thief host."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tt-assets.workspace = true
tt-platform.workspace = true
tt-bridge.workspace = true

getrandom = { version = "0.4", features = ["wasm_js"] }
chrono = { version = "0.4", default-features = false, features = ["wasmbind", "alloc"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
url = "2"
encoding_rs = "0.8"
base64 = "0.22"
async-channel = "2"
web-sys = { version = "0.3", features = [
    "Location",
    "Storage",
    "DomException",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbIndex",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
    "Response",
    "Request",
    "RequestInit",
    "RequestMode",
] }
console_error_panic_hook = "0.1"
tracing.workspace = true
tracing-wasm = "0.2"

ruffle_render.workspace = true
ruffle_core = { path = "../../vendor/ruffle/core", default-features = false, features = [
    "default_font",
    "default_compatibility_rules",
    "mp3",
    "audio",
] }
ruffle_render_wgpu = { path = "../../vendor/ruffle/render/wgpu", features = ["webgl"] }

# The crate body is wasm-only (`#![cfg(target_family = "wasm")]`), so a native
# `cargo clippy --workspace` sees every dependency as unused.
[lints.rust]
unused_crate_dependencies = "allow"

[lints.cargo]
unused_dependencies = "allow"
