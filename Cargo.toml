[workspace]
resolver = "2"
exclude = ["vendor"]

members = [
    "crates/tt-assets",
    "crates/tt-platform",
    "crates/tt-bridge",
    "crates/tt-host",
    "crates/tt-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tt-assets = { path = "crates/tt-assets" }
tt-platform = { path = "crates/tt-platform" }
tt-bridge = { path = "crates/tt-bridge" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flash-lso = { git = "https://github.com/ruffle-rs/rust-flash-lso", rev = "61b717248aae853a4f5d8a103eba704268d286c8" }
aes = "0.8"
cbc = "0.1"

# Pinned Flash/AS3 engine. Not on crates.io -> git + tag.
ruffle_core = { path = "vendor/ruffle/core", default-features = false, features = [
    "default_font",
    "default_compatibility_rules",
    "mp3",
    "audio",
] }
ruffle_render_wgpu = { path = "vendor/ruffle/render/wgpu" }
ruffle_render = { path = "vendor/ruffle/render" }
ruffle_frontend_utils = { path = "vendor/ruffle/frontend-utils", default-features = false, features = ["cpal", "fs"] }

# Ruffle's AVM2 has depth arithmetic that overflows on purpose (Flash wraps at 0xFFFF);
# debug overflow checks turn that into a panic. Match release semantics for the whole graph.
[profile.dev]
overflow-checks = false
opt-level = 1

[profile.dev.package."*"]
overflow-checks = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
